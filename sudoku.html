<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sudoku Solver</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: #080d1a;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        .container {

            width: 100%;

            max-width: 850px;

            text-align: center;
        }


        /* HEADER */

        .header {

            margin-bottom: 25px;
        }


        .header h1 {

            font-size: 42px;

            letter-spacing: 1px;
        }


        .header h1 span {

            color: #4da3ff;
        }


        .header p {

            margin-top: 8px;

            color: #8994aa;

            font-size: 15px;
        }


        /* MAIN APP */

        .app {

            background: #121a2b;

            padding: 30px;

            border-radius: 20px;

            border: 1px solid #27334d;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45);
        }


        /* TIMER */

        .timer-box {

            margin-bottom: 20px;
        }


        .timer-label {

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #8994aa;
        }


        #timer {

            margin-top: 5px;

            font-size: 30px;

            font-weight: bold;

            color: #4da3ff;
        }


        /* BOARD */

        .board-container {

            display: flex;

            justify-content: center;

            margin-bottom: 25px;
        }


        #board {

            display: grid;

            grid-template-columns:
                repeat(9, 50px);

            grid-template-rows:
                repeat(9, 50px);

            border: 3px solid #4da3ff;
        }


        .cell {

            width: 50px;

            height: 50px;

            background: #0d1424;

            color: white;

            border: 1px solid #303b55;

            text-align: center;

            font-size: 20px;

            font-weight: 500;

            outline: none;

            transition: 0.15s;
        }


        .cell:focus {

            background: #18253d;

            box-shadow:
                inset 0 0 0 1px #4da3ff;
        }


        /* 3x3 BOX LINES */

        .cell:nth-child(3n) {

            border-right:
                2px solid #4da3ff;
        }


        .cell:nth-child(9n) {

            border-right: none;
        }


        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {

            border-bottom:
                2px solid #4da3ff;
        }


        /* GIVEN NUMBERS */

        .given {

            color: #4da3ff;

            font-weight: bold;

            background: #111a2d;

            cursor: not-allowed;
        }


        /* SOLVED NUMBERS */

        .solved {

            color: #63e6a8;

            font-weight: bold;
        }


        /* WRONG INPUT */

        .wrong {

            border:
                2px solid #ff4d6d !important;

            background:
                rgba(255, 77, 109, 0.15) !important;

            color: #ff6b81 !important;

            box-shadow:
                inset 0 0 8px
                rgba(255,77,109,0.15);
        }


        /* BUTTONS */

        .controls {

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        button {

            border: none;

            padding: 12px 23px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .solve {

            background: #4da3ff;

            color: white;
        }


        .solve:hover {

            background: #2f8de0;

            transform:
                translateY(-2px);
        }


        .reset {

            background: #293550;

            color: white;
        }


        .reset:hover {

            background: #3a4968;
        }


        .clear {

            background: #ff4d6d;

            color: white;
        }


        .clear:hover {

            background: #e63d5c;
        }


        /* STATUS */

        #status {

            min-height: 25px;

            margin-top: 20px;

            color: #9ca8bd;

            font-size: 14px;
        }


        /* STATS */

        .stats {

            display: flex;

            justify-content: center;

            gap: 70px;

            margin-top: 20px;

            color: #8994aa;
        }


        .stat-value {

            color: white;

            font-size: 20px;

            font-weight: bold;

            margin-top: 5px;
        }


        /* ALGORITHM */

        .algorithm {

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            background: #0d1424;

            color: #8994aa;

            font-size: 13px;

            line-height: 1.5;
        }


        /* MOBILE */

        @media(max-width: 600px) {

            body {

                padding: 15px;
            }


            .app {

                padding: 15px;
            }


            #board {

                grid-template-columns:
                    repeat(9, 35px);

                grid-template-rows:
                    repeat(9, 35px);
            }


            .cell {

                width: 35px;

                height: 35px;

                font-size: 16px;
            }


            .header h1 {

                font-size: 30px;
            }


            .stats {

                gap: 40px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Sudoku <span>Solver</span>
        </h1>

        <p>
            Automated puzzle solving using
            the Backtracking Algorithm
        </p>

    </div>



    <div class="app">


        <!-- TIMER -->

        <div class="timer-box">

            <div class="timer-label">
                Solving Time
            </div>

            <div id="timer">
                00:00
            </div>

        </div>



        <!-- SUDOKU BOARD -->

        <div class="board-container">

            <div id="board"></div>

        </div>



        <!-- CONTROLS -->

        <div class="controls">

            <button
                class="solve"
                onclick="solveSudoku()">

                Solve Puzzle

            </button>


            <button
                class="reset"
                onclick="resetBoard()">

                Reset

            </button>


            <button
                class="clear"
                onclick="clearBoard()">

                Clear

            </button>

        </div>



        <!-- STATUS -->

        <div id="status">

            Enter numbers to start solving.

        </div>



        <!-- STATS -->

        <div class="stats">


            <div>

                Attempts

                <div
                    class="stat-value"
                    id="attempts">

                    0

                </div>

            </div>


            <div>

                Empty Cells

                <div
                    class="stat-value"
                    id="empty">

                    51

                </div>

            </div>


        </div>



        <!-- ALGORITHM INFO -->

        <div class="algorithm">

            <strong>Algorithm:</strong>

            Recursive Backtracking with
            Row, Column and 3×3 Box
            Constraint Checking

        </div>


    </div>

</div>



<script>


// ==================================================
// SAMPLE SUDOKU PUZZLE
// ==================================================

const puzzle = [

    [5, 3, 0, 0, 7, 0, 0, 0, 0],

    [6, 0, 0, 1, 9, 5, 0, 0, 0],

    [0, 9, 8, 0, 0, 0, 0, 6, 0],

    [8, 0, 0, 0, 6, 0, 0, 0, 3],

    [4, 0, 0, 8, 0, 3, 0, 0, 1],

    [7, 0, 0, 0, 2, 0, 0, 0, 6],

    [0, 6, 0, 0, 0, 0, 2, 8, 0],

    [0, 0, 0, 4, 1, 9, 0, 0, 5],

    [0, 0, 0, 0, 8, 0, 0, 7, 9]

];



// ==================================================
// DOM ELEMENTS
// ==================================================

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const timerElement =
    document.getElementById("timer");

const attemptsElement =
    document.getElementById("attempts");

const emptyElement =
    document.getElementById("empty");



// ==================================================
// VARIABLES
// ==================================================

let attempts = 0;

let seconds = 0;

let timerInterval = null;

let timerStarted = false;



// ==================================================
// CREATE BOARD
// ==================================================

function createBoard() {

    boardElement.innerHTML = "";


    for(let row = 0; row < 9; row++) {


        for(let col = 0; col < 9; col++) {


            const input =
                document.createElement("input");


            input.classList.add("cell");


            input.type = "text";


            input.maxLength = 2;


            input.dataset.row = row;


            input.dataset.col = col;



            const value =
                puzzle[row][col];



            // GIVEN NUMBER

            if(value !== 0) {

                input.value = value;

                input.readOnly = true;

                input.classList.add("given");

            }



            // USER INPUT

            input.addEventListener(
                "input",
                function() {

                    startTimer();

                    validateInput(this);

                    updateEmptyCount();

                }
            );


            boardElement.appendChild(input);

        }

    }


    updateEmptyCount();

}



// ==================================================
// TIMER
// ==================================================

function startTimer() {

    if(timerStarted) {

        return;

    }


    timerStarted = true;


    timerInterval =
        setInterval(function() {


            seconds++;


            const minutes =
                Math.floor(seconds / 60);


            const secs =
                seconds % 60;


            timerElement.textContent =

                String(minutes)
                    .padStart(2,"0")

                + ":" +

                String(secs)
                    .padStart(2,"0");


        }, 1000);

}



function stopTimer() {

    clearInterval(timerInterval);

}



// ==================================================
// GET BOARD
// ==================================================

function getBoard() {

    const cells =
        document.querySelectorAll(".cell");


    let board = [];


    for(let row = 0; row < 9; row++) {


        board[row] = [];


        for(let col = 0; col < 9; col++) {


            const index =
                row * 9 + col;


            const value =
                cells[index].value;


            board[row][col] =
                /^[1-9]$/.test(value)
                    ? parseInt(value)
                    : 0;

        }

    }


    return board;

}



// ==================================================
// VALIDATE USER INPUT
// ==================================================

function validateInput(cell) {


    const value =
        cell.value;


    // EMPTY

    if(value === "") {

        cell.classList.remove("wrong");

        statusElement.textContent =
            "Enter a number from 1 to 9.";

        return;

    }



    // INVALID CHARACTER

    if(!/^[1-9]$/.test(value)) {


        cell.classList.add("wrong");


        statusElement.textContent =
            "Invalid input! Only numbers 1-9 are allowed.";

        return;

    }



    const row =
        parseInt(cell.dataset.row);


    const col =
        parseInt(cell.dataset.col);


    const num =
        parseInt(value);


    const board =
        getBoard();



    // Temporarily remove current value

    board[row][col] = 0;



    // CHECK SUDOKU RULE

    if(!isValid(
        board,
        row,
        col,
        num
    )) {


        cell.classList.add("wrong");


        statusElement.textContent =
            "Invalid number! Conflict found in row, column or 3×3 box.";

    }

    else {


        cell.classList.remove("wrong");


        statusElement.textContent =
            "Valid number ✓";

    }

}



// ==================================================
// CHECK NUMBER
// ==================================================

function isValid(
    board,
    row,
    col,
    num
) {


    // CHECK ROW

    for(let x = 0; x < 9; x++) {


        if(board[row][x] === num) {

            return false;

        }

    }



    // CHECK COLUMN

    for(let x = 0; x < 9; x++) {


        if(board[x][col] === num) {

            return false;

        }

    }



    // CHECK 3x3 BOX

    const startRow =
        row - row % 3;


    const startCol =
        col - col % 3;


    for(let i = 0; i < 3; i++) {


        for(let j = 0; j < 3; j++) {


            if(
                board[startRow + i]
                     [startCol + j]
                === num
            ) {

                return false;

            }

        }

    }


    return true;

}



// ==================================================
// FIND EMPTY CELL
// ==================================================

function findEmptyCell(board) {


    for(let row = 0; row < 9; row++) {


        for(let col = 0; col < 9; col++) {


            if(board[row][col] === 0) {

                return [row, col];

            }

        }

    }


    return null;

}



// ==================================================
// BACKTRACKING SOLVER
// ==================================================

function solve(board) {


    const emptyCell =
        findEmptyCell(board);



    // NO EMPTY CELL = SOLVED

    if(emptyCell === null) {

        return true;

    }


    const row =
        emptyCell[0];


    const col =
        emptyCell[1];



    // TRY NUMBERS 1-9

    for(let num = 1; num <= 9; num++) {


        attempts++;


        if(
            isValid(
                board,
                row,
                col,
                num
            )
        ) {


            // PLACE NUMBER

            board[row][col] = num;



            // RECURSION

            if(solve(board)) {

                return true;

            }



            // BACKTRACK

            board[row][col] = 0;

        }

    }


    return false;

}



// ==================================================
// SOLVE PUZZLE
// ==================================================

function solveSudoku() {


    startTimer();


    const cells =
        document.querySelectorAll(".cell");



    // CHECK INVALID CELLS

    for(const cell of cells) {


        if(
            cell.classList.contains("wrong")
        ) {


            statusElement.textContent =
                "Fix the red cells before solving.";

            return;

        }

    }



    const board =
        getBoard();


    attempts = 0;


    statusElement.textContent =
        "Solving Sudoku...";



    const solved =
        solve(board);



    attemptsElement.textContent =
        attempts;



    if(solved) {


        updateBoard(board);


        stopTimer();


        statusElement.textContent =
            "✓ Sudoku solved successfully!";

    }

    else {


        statusElement.textContent =
            "✕ This Sudoku puzzle has no solution.";

    }

}



// ==================================================
// UPDATE BOARD AFTER SOLVING
// ==================================================

function updateBoard(board) {


    const cells =
        document.querySelectorAll(".cell");


    for(let row = 0; row < 9; row++) {


        for(let col = 0; col < 9; col++) {


            const index =
                row * 9 + col;



            if(
                !cells[index]
                    .classList
                    .contains("given")
            ) {


                cells[index].value =
                    board[row][col];


                cells[index]
                    .classList
                    .remove("wrong");


                cells[index]
                    .classList
                    .add("solved");

            }

        }

    }


    updateEmptyCount();

}



// ==================================================
// EMPTY CELL COUNT
// ==================================================

function updateEmptyCount() {


    const board =
        getBoard();


    let count = 0;


    for(let row = 0; row < 9; row++) {


        for(let col = 0; col < 9; col++) {


            if(board[row][col] === 0) {

                count++;

            }

        }

    }


    emptyElement.textContent =
        count;

}



// ==================================================
// RESET
// ==================================================

function resetBoard() {


    stopTimer();


    seconds = 0;


    timerStarted = false;


    timerElement.textContent =
        "00:00";


    attempts = 0;


    attemptsElement.textContent =
        "0";


    createBoard();


    statusElement.textContent =
        "Puzzle reset successfully.";

}



// ==================================================
// CLEAR
// ==================================================

function clearBoard() {


    stopTimer();


    seconds = 0;


    timerStarted = false;


    timerElement.textContent =
        "00:00";


    attempts = 0;


    attemptsElement.textContent =
        "0";


    const cells =
        document.querySelectorAll(".cell");


    cells.forEach(function(cell) {


        if(
            !cell.classList.contains("given")
        ) {


            cell.value = "";


            cell.classList.remove("wrong");


            cell.classList.remove("solved");

        }

    });


    updateEmptyCount();


    statusElement.textContent =
        "Board cleared. Enter your Sudoku puzzle.";

}



// ==================================================
// INITIALIZE
// ==================================================

createBoard();

</script>

</body>

</html>
